name: Release Metrik POS for Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled POS UI
        shell: pwsh
        run: |
          # Sin la interfaz local el instalador cargaría la versión web y no funcionaría sin conexión.
          if (-not (Test-Path "pos-ui/login-pos/index.html")) { Write-Error "Falta pos-ui: ejecuta npm run build:pos-ui y versiona pos-ui antes de publicar."; exit 1 }

      - name: Build and publish Windows installer
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
