name: Publicar Metrik POS Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Una única publicación a la vez, sin interrumpir una subida en curso.
concurrency:
  group: metrik-pos-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Comprobar versión pendiente
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/github-release.cjs').run({ github, context, core, phase: 'plan' });

      - name: Instalar dependencias
        if: steps.plan.outputs.publish == 'true'
        run: npm ci

      - name: Pruebas de escritorio
        if: steps.plan.outputs.publish == 'true'
        run: npm test

      - name: Comprobar interfaz offline incluida
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "pos-ui/login-pos/index.html")) { throw "Falta pos-ui: ejecuta npm run build:pos-ui e incluye pos-ui en el commit." }
          if (-not (Test-Path "pos-ui/pos/index.html")) { throw "Falta la pantalla de caja offline." }
          if (-not (Test-Path "pos-ui/dashboard/index.html")) { throw "Falta la vista rápida del panel." }
          if (-not (Test-Path "pos-ui/dashboard/sales/index.html")) { throw "Falta el historial de ventas de la vista rápida." }

      # La interfaz ya está versionada: no requiere un checkout del frontend.
      - name: Compilar instalador sin publicar
        if: steps.plan.outputs.publish == 'true'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Crear tag, subir archivos y publicar release estable
        if: steps.plan.outputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/github-release.cjs').run({ github, context, core, phase: 'publish' });
